name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

# One deploy at a time per branch, newest wins: without this, two quick pushes
# can race and leave the OLDER build live. Cancelling mid-run is safe — a Pages
# deployment is atomic (upload, then activate), so a cancelled upload never
# goes live. Per-ref groups keep main and staging independent.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this job writes to the repository. The Cloudflare token is what
# deploys, and it is a secret, not a permission.
permissions:
  contents: read

# Actions are pinned by commit, not tag: a tag is a pointer someone else can
# move, and these steps run holding the Cloudflare token. The pins are the ones
# the hub's own deploy runs (noahjefferson .github/workflows/deploy.yml), and
# .github/dependabot.yml keeps them current.

# Wrangler itself is pinned too, for the same reason. Without a version the
# action checks for its own default and, when it is missing (always, on a fresh
# runner), installs `wrangler@4`, a range, in the job holding the Cloudflare
# token. The same action at the same commit ran 4.86.0 here and 4.139.0 in the
# hub on the same night, and the hub's deploy failed once on a release npm was
# not yet serving. 4.86.0 is what this repo's last green deploy ran (read from
# its log on 2026-09-25), so pinning it changes nothing that deploys. Dependabot
# does not move this; changing it is a deliberate edit, read against a deploy
# log afterwards.
env:
  WRANGLER_VERSION: "4.86.0"

jobs:
  deploy:
    # Only main (production) and staging may deploy — a manual dispatch from a
    # work branch must never bypass the owner's staging gate.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the build derives real version numbers from
          # the commit count (v0.N) and shows an exact tag (v1.0+) when present.
          fetch-depth: 0
          # Nothing here pushes, so the token does not stay in .git/config for
          # every later step to read.
          persist-credentials: false
      # No npm cache in the job that deploys: a cache is shared with other
      # workflows' runs, and whatever is restored from it ends up in the build
      # that goes live. `npm ci` from the lockfile every time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          # From v5 this action caches on its own unless told not to.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Create the Pages project on first run; harmless (and ignored) afterwards.
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create jefferson-photo-studio --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          # staging branch -> preview URL (staging.jefferson-photo-studio.pages.dev);
          # everything else -> production (jefferson-photo-studio.pages.dev).
          command: pages deploy dist --project-name=jefferson-photo-studio --branch=${{ github.ref_name == 'staging' && 'staging' || 'main' }} --commit-dirty=true
      # The app used to live at infrared-photography-studio.pages.dev. Keep that
      # old project alive but serving only a 301 -> the new home (see redirect/),
      # so existing links and Home-Screen installs still land somewhere useful.
      # Production pushes only — staging must never touch the old prod domain.
      - name: Redirect the old domain to the new one
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy redirect --project-name=infrared-photography-studio --branch=main --commit-dirty=true
