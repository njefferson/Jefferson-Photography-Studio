name: Gates

# THE HUB'S GATES, CALLED RATHER THAN COPIED.
#
# The gates themselves were never forked — each takes `--repo ../app`, which is
# why five divergent copies do not exist. The WORKFLOW that calls them was
# copied into eight repos by hand and drifted exactly the way a forked file
# does, so "which gates does this repo run" had eight answers. This repo was
# one of the ones answering "none": it referenced the hub in no workflow at
# all, and the never-in-the-third-person gate had therefore never run here.
#
# It was red when first run: 119 references across 13 files, 92 of them in
# NOTES.md, in a public repository. Scrubbing that is worth nothing if nothing
# holds it — which is what this file is for.
#
# The inputs each name a FACT about this repo rather than a preference. `pwa` is
# true because there is a service worker. `mirror` is false because this repo
# does not carry its own offline copy of the disclosure patterns.
#
# `textsize-paths` was empty for the life of this file, under a note calling it
# a real gap rather than an opinion — and a gap that is named and not closed is
# a gap. Filled 2026-09-14 with every stylesheet this app ships and every page
# it serves from source. It came back green on the first run (no fixed font
# sizes, 100 relative declarations) and a planted `font-size: 13px` in
# swstrip.css made it fail, so the green is a measurement rather than an
# absence. It matters here beyond conformance: page zoom scales px and these
# apps are used on a tablet, where raising the default text size is the setting
# people actually reach for, and a px-only stylesheet does nothing for them.
#
# `palette-path` was empty under the same kind of note, and is filled now with
# `palettes/studio.json` — GENERATED by tools/palette-spec.mjs from the
# stylesheet that ships, read resolved out of a real browser, rather than typed
# as a second copy of public/palette.css. It found things on the way in: the
# crop bar took its fill from the theme-following accent wash while every chip
# inside it painted the theme-INVARIANT --glass-txt, so near-white sat on a
# light wash at 1.56:1 in the day theme; accent-coloured labels on the accent
# wash fell under 4.5:1 in six of twenty-four ground x palette pairs, because
# the tint pulls the ground toward the very colour the text is; and three
# declarations named a --txt-1 that no stylesheet in this repo has ever defined.
#
# The spec is a committed artefact, so two checks hold it to the app rather than
# to itself: tools/palette-spec-check.mjs (in .branch-guard, no browser) pins it
# to the sha256 of public/palette.css, and section 4 of tools/a11y-walk.mjs
# re-measures the `_renders` list from the running app and fails in BOTH
# directions. That list is what downgrades an unpainted pairing from a failure
# to a forecast, so a short one is not a smaller gate, it is a quieter one.
#
# The flag is a description, NEVER a way to switch a failing gate off. Two were
# failing when this was wired — an undeclared placeholder pair and an `npm
# install` in the asset-factory workflow — and both were fixed rather than
# declared away.
#
# The pin is read out of THIS file's own `uses:` line by the called workflow, so
# the gates and the wiring can never be two different versions.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@95df5c489e843e6ce2bafbb80a1336049160747a
    with:
      pwa: true
      textsize-paths: src/style.css src/launcher.css src/swstrip.css public/palette.css ir.html macro.html index.html debug.html privacy.html
      palette-path: palettes/studio.json
