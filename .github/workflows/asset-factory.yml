# Manual overlay-asset generation run. Trigger from the GitHub Actions UI
# (works from the iPad browser) — no CLI needed. It uses the IDEOGRAM_API_KEY
# repo secret, generates a bounded batch, and uploads the images + catalog as a
# downloadable artifact to review. It does NOT commit anything or touch the app,
# main, or staging — promoting reviewed assets into public/stickers/ stays a
# deliberate session step behind the normal staging gate.
#
# Only this file lives on main (so the manual trigger is available); the factory
# code it runs is checked out from `ref` (the asset-pipeline branch by default),
# so the still-evolving tooling stays off main until it merges on its own.
name: asset-factory

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to run the factory code from"
        type: string
        default: claude/jefferson-asset-pipeline-9y19wa
      provider:
        description: "Image provider (flux = photoreal render + Ideogram cutout)"
        type: choice
        default: flux
        options: [flux, ideogram, mock]
      category:
        description: "Category filter (blank = all). e.g. cryptids,ufo"
        type: string
        default: ""
      per_category:
        description: "Breadth-first: max entries PER category this run (blank = no cap)"
        type: string
        default: ""
      ids:
        description: "Targeted re-roll: only these entry ids (comma-separated, blank = all)"
        type: string
        default: ""
      limit:
        description: "Max images this run (cost guard — ideogram is ~$0.08 each)"
        type: string
        default: "10"
      confirm:
        description: "Actually spend? Unchecked = dry-run (prompts + cost only)"
        type: boolean
        default: false

# Never run this on a push; manual only.
concurrency: asset-factory-${{ github.ref }}

# Needs write access to push the review batch to its throwaway branch.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # EVERY INPUT REACHES A SHELL THROUGH `env:`, never by `${{ }}` inside a
    # `run:`. An expression is pasted into the script before the shell parses
    # it, so a category typed as `x"; curl …` would have run as code with this
    # job's write token. Through the environment it is only ever a string.
    env:
      PROVIDER: ${{ inputs.provider }}
      CATEGORY: ${{ inputs.category }}
      PER_CATEGORY: ${{ inputs.per_category }}
      IDS: ${{ inputs.ids }}
      LIMIT: ${{ inputs.limit }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # Pinned by commit, as the hub's workflows are; .github/dependabot.yml
      # keeps the pins current. The credentials stay in .git/config on purpose:
      # the last step pushes the review batch. The artifact upload below names
      # asset-factory/ paths only, so .git never goes into an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: true # zizmor: ignore[artipacked]

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      # `npm ci`, NOT `npm install`: install resolves whatever the registry
      # serves at that moment, so a run is not reproducible and a compromised
      # or merely newer transitive dependency lands without anything saying so.
      # ci is bound by the lockfile, which is committed beside the manifest.
      - name: Install factory deps
        working-directory: asset-factory
        run: npm ci

      - name: Plan (counts + cost estimate)
        working-directory: asset-factory
        run: |
          args=(--provider "$PROVIDER")
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          node cli.mjs plan "${args[@]}"

      - name: Generate
        working-directory: asset-factory
        env:
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          args=(--provider "$PROVIDER")
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          if [ -n "$PER_CATEGORY" ]; then args+=(--per-category "$PER_CATEGORY"); fi
          if [ -n "$IDS" ]; then args+=(--ids "$IDS"); fi
          args+=(--limit "$LIMIT")
          if [ "$CONFIRM" = "true" ]; then args+=(--yes); else args+=(--dry-run); fi
          node cli.mjs generate "${args[@]}"

      - name: Stats
        if: ${{ inputs.confirm }}
        working-directory: asset-factory
        run: |
          args=()
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          node cli.mjs stats "${args[@]}"

      # Publish the approved batch as viewable PNGs + a contact sheet, then push
      # them to a throwaway branch. A session reads them back over the GitHub API
      # (the artifact blob host is egress-blocked) and hands them to the owner.
      - name: Publish review batch
        if: ${{ inputs.confirm }}
        working-directory: asset-factory
        run: |
          args=()
          if [ -n "$CATEGORY" ]; then args+=(--category "$CATEGORY"); fi
          node cli.mjs publish-review "${args[@]}"

      - name: Push review batch to the review branch
        if: ${{ inputs.confirm }}
        run: |
          git config user.name "asset-factory-bot"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan review-tmp
          git reset
          git add -f asset-factory/review asset-factory/database/catalog
          git commit -m "Review batch: ${CATEGORY} (run ${GITHUB_RUN_ID})"
          git push -f origin review-tmp:claude/asset-factory-review

      # STILL ON A TAG. No pin for this action has been vetted anywhere in this
      # repo or the hub, and a pin copied from a search result is a pin nobody
      # checked. Owed, and the one finding zizmor still reports here.
      - name: Upload results (images + catalog)
        if: ${{ inputs.confirm }}
        uses: actions/upload-artifact@v7
        with:
          name: asset-factory-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            asset-factory/assets/**
            asset-factory/rejected/**
            asset-factory/duplicates/**
            asset-factory/database/catalog/**
            asset-factory/logs/**
